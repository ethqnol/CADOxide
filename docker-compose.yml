version: '3.8'

services:
  loadbalancer:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api

  api:
    image: ghcr.io/cadoxide/server:latest
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: always
    environment:
      - DATABASE_URL=postgres://cadoxide:oxidepass@postgres:5432/cadoxide
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET=cadoxide-assets
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - REDIS_URL=redis://redis:6379
    expose:
      - "8080"
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis
      - minio

  worker:
    image: ghcr.io/cadoxide/kicad-worker:latest
    restart: always
    # Horizontally scalable headless KiCad consumer pool:
    # docker compose up -d --scale worker=4
    environment:
      - REDIS_URL=redis://redis:6379
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - WORKER_CONCURRENCY=4
      - QUEUE_PRIORITY=high,bulk
    depends_on:
      - redis
      - minio

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_USER=cadoxide
      - POSTGRES_PASSWORD=oxidepass
      - POSTGRES_DB=cadoxide
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    restart: always
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"

volumes:
  pgdata:
  miniodata:
