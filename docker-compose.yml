version: '3.8'

services:
  api:
    image: ghcr.io/cadenceflow/server:latest
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: always
    environment:
      - DATABASE_URL=postgres://cadence:flowpass@postgres:5432/cadenceflow
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET=cadenceflow-assets
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - REDIS_URL=redis://redis:6379
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis
      - minio

  worker:
    image: ghcr.io/cadenceflow/kicad-worker:latest
    restart: always
    # Dockerfile includes: ubuntu:24.04 + ppa:kicad/kicad-8.0-releases + kicad
    environment:
      - REDIS_URL=redis://redis:6379
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
    depends_on:
      - redis
      - minio

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_USER=cadence
      - POSTGRES_PASSWORD=flowpass
      - POSTGRES_DB=cadenceflow
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    restart: always
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"

volumes:
  pgdata:
  miniodata:
