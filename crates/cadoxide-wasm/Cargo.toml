[package]
name = "cadoxide-wasm"
version = "0.2.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "=0.2.127"
js-sys = "=0.3.104"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dependencies.web-sys]
version = "=0.3.104"
features = [
  "console",
  "Window",
  "Document",
  "Node",
  "NodeList",
  "Element",
  "HtmlElement",
  "HtmlCanvasElement",
  "HtmlInputElement",
  "HtmlSelectElement",
  "HtmlTextAreaElement",
  "HtmlImageElement",
  "CanvasRenderingContext2d",
  "ImageData",
  "WebGl2RenderingContext",
  "WebGlBuffer",
  "WebGlProgram",
  "WebGlShader",
  "WebGlUniformLocation",
  "WebGlVertexArrayObject",
  "MouseEvent",
  "WheelEvent",
  "KeyboardEvent",
  "CssStyleDeclaration",
  "Event",
  "EventTarget",
  "DomRect",
  "Response",
  "Request",
  "RequestInit",
  "Headers",
  "Performance",
  "DomTokenList",
  "File",
  "FileList",
  "FileReader",
  "DragEvent",
  "DataTransfer",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
